name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: test race
        run: go test -race ./...
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -o /tmp/kpod ./cmd/kpod
      - name: shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n install.sh
          bash -n legacy/kpod-v1
      - name: installer helpers
        run: sh scripts/install_test.sh
